# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Integer Linear Programming · Fabio Furini
site_description: >-
  Integer Linear Programming: the course lecture notes online, with definitions,
  theorems and proofs, worked examples and exercises with solutions.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/integer-linear-programming/
repo_url: https://github.com/fabiofurini/integer-linear-programming
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/integer-linear-programming/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/programmazione-lineare-intera/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/integer-linear-programming/
      lang: en

extra_css:
  - stylesheets/extra.css?v=d60085bd58
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=5d53d6f224

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=d520028579
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, il catalogo dei problemi, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=21dd4bf4df
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-pli-dati.js?v=2ceb07c747
  - javascripts/gi-pli.js?v=4a489dfe2c

nav:
  - Home: index.md
  - Bounds:
      - models-and-bounds/index.md
      - "1. Integer linear programming": models-and-bounds/ilp.md
      - "2. LP relaxation": models-and-bounds/lp-relaxation.md
  - Formulations:
      - formulations/index.md
      - "3. Ideal formulations": formulations/ideal-formulations.md
      - "4. Valid inequalities": formulations/valid-inequalities.md
      - "5. Cover inequalities": formulations/cover.md
  - Exact methods:
      - exact-methods/index.md
      - "6. Cutting planes": exact-methods/gomory.md
      - "7. Branch-and-bound": exact-methods/bb.md
      - "8. Branch-and-cut": exact-methods/branch-and-cut.md
  - Solvers:
      - solvers/index.md
      - "9. MIP solvers": solvers/mip-solvers.md
  - Heuristics:
      - mip-heuristics/index.md
      - "10. MIP heuristics": mip-heuristics/mip-heuristics.md
  - Exercises:
      - exercises/index.md
      - "5. Cover inequalities": exercises/cover.md
      - "6. Cutting planes": exercises/gomory.md
      - "7. Branch-and-bound": exercises/bb.md
      - "10. MIP heuristics": exercises/mip-heuristics.md
  - Lab: lab/index.md
  - Downloads: downloads.md
  - Index: indice.md
